<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Inter:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;overflow:hidden;font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#16181b 0%,#26292d 55%,#16181b 100%);position:relative;}
.waves{position:absolute;inset:0;opacity:.13;}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 80px;}
.eyebrow{color:#F26A21;font-weight:600;font-size:22px;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:14px;}
h1{font-family:'Zilla Slab';font-weight:700;font-size:74px;line-height:1.04;color:#f1f0ee;margin-top:22px;letter-spacing:-1px;}
h1 .o{color:#F26A21;}
.sub{color:rgba(241,240,238,.72);font-size:27px;margin-top:24px;font-weight:500;}
.bar{display:inline-flex;margin-top:34px;background:#F26A21;color:#f6f4ee;font-weight:700;
  font-size:18px;letter-spacing:1.5px;padding:13px 22px;border-radius:5px;}
.foot{position:absolute;bottom:48px;left:80px;right:80px;display:flex;align-items:center;justify-content:space-between;z-index:2;}
.brand{display:flex;align-items:center;gap:16px;}
.brand .name{font-family:'Zilla Slab';font-weight:700;font-size:26px;color:#f1f0ee;letter-spacing:-.5px;}
.brand .tag{font-size:13px;color:rgba(241,240,238,.5);letter-spacing:.22em;text-transform:uppercase;}
.phone{font-weight:700;font-size:26px;color:#f1f0ee;}
svg.icon{width:62px;height:62px;}
</style>
</head>
<body>
<svg class="waves" preserveAspectRatio="none" viewBox="0 0 1200 630">
  <g>
    <path d="M-20,90 q60,40 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0" fill="none" stroke="#F26A21" stroke-width="4"/>
    <path d="M-20,190 q60,40 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0" fill="none" stroke="#F26A21" stroke-width="4"/>
    <path d="M-20,290 q60,40 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0" fill="none" stroke="#F26A21" stroke-width="4"/>
    <path d="M-20,390 q60,40 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0" fill="none" stroke="#F26A21" stroke-width="4"/>
    <path d="M-20,490 q60,40 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0" fill="none" stroke="#F26A21" stroke-width="4"/>
  </g>
</svg>

<div class="wrap">
  <div class="eyebrow">
    <svg width="56" height="14"><path d="M2,7 q5,4 10,0 t10,0 t10,0 t10,0 t10,0" fill="none" stroke="#F26A21" stroke-width="2.6" stroke-linecap="round"/></svg>
    NorCal Insulation · Since 2020
  </div>
  <h1>A comfortable home,<br><span class="o">sealed tight</span> and done clean.</h1>
  <div class="sub">Spray foam · Blown-in · Batt · Old insulation removal</div>
</div>

<div class="foot">
  <div class="brand">
    <svg class="icon" viewBox="98 30 164 160">
      <path d="M180,40 L110,96 L110,178 L250,178 L250,96 Z" fill="none" stroke="#f4f1ea" stroke-width="11" stroke-linejoin="round"/>
      <path d="M132,104 q16,12 32,0 t32,0 t32,0" fill="none" stroke="#F26A21" stroke-width="8.5" stroke-linecap="round"/>
      <path d="M132,124 q16,12 32,0 t32,0 t32,0" fill="none" stroke="#F26A21" stroke-width="8.5" stroke-linecap="round"/>
      <path d="M132,144 q16,12 32,0 t32,0 t32,0" fill="none" stroke="#F26A21" stroke-width="8.5" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="name">H&amp;S INSULATION</div>
      <div class="tag">Yuba City · NorCal</div>
    </div>
  </div>
  <div class="phone">(916) 912-2080</div>
</div>
</body>
</html>
